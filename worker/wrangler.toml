name = "moonlake-rank"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://leenamgyeol-spec.github.io,http://localhost:5540"
MAINTENANCE = "0"

# 랭킹·우편함은 Durable Object(Board) 한 곳에 저장한다. 동시에 갱신해도 덮어쓰지 않는다.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# 예전 랭킹을 처음 한 번 옮겨 오는 데만 쓴다 (darok-board와 같은 RATE 네임스페이스, 키 앞에 "moon:").
[[kv_namespaces]]
binding = "RATE"
id = "0f4282147d1941bb898cf428572f0d48"
